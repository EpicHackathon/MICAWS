name: Verify meeting workspace
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: micaws_test
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-concurrency=1
        env:
          MICAWS_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/micaws_test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s test -p backend_transcription_test.py
      - run: docker build -f Dockerfile.pilot -t micaws-pilot:test .
