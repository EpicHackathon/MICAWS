services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env.local
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html:ro
      - ./vite.config.js:/app/vite.config.js:ro
    environment:
      - CHOKIDAR_USEPOLLING=true

  diart:
    build:
      context: .
      dockerfile: Dockerfile.diart
    volumes:
      - ./backend/diart:/app/diart_service
      - ./audio:/app/audio
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    command: python -c "import diart; print('diart ready')"

volumes:
  huggingface-cache:
