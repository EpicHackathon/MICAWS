services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env.local
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
      - TRANSCRIPTION_URL=http://transcription:8000

  transcription:
    build:
      context: .
      dockerfile: Dockerfile.transcription
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - whisperx-cache:/root/.cache

  diart:
    profiles:
      - diart
    build:
      context: .
      dockerfile: Dockerfile.diart
    volumes:
      - ./backend/diart:/app/diart_service
      - ./audio:/app/audio
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    command: python -c "import diart; print('diart ready')"

volumes:
  huggingface-cache:
  whisperx-cache:
