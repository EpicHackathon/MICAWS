services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: micaws
      POSTGRES_USER: micaws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - meeting-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micaws -d micaws"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  workspace:
    build:
      context: .
      dockerfile: Dockerfile.pilot
    env_file: .env.pilot
    environment:
      DATABASE_URL: postgresql://micaws:${POSTGRES_PASSWORD}@postgres:5432/micaws
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  meeting-db:
